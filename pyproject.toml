[project]
name = "tinagent-os"
version = "0.2.0"
description = "Tin OS: install a browser home for AI apps and persistent work sessions"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["ai-agents", "human-agentos", "tmux", "opencode", "pi-web", "self-hosted"]

[project.scripts]
tin-os = "tin_os.server:main"

[project.urls]
Homepage = "https://github.com/DigitalVersion/tinagent-os"
Demo = "https://agentdo.agency/tin"
Issues = "https://github.com/DigitalVersion/tinagent-os/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tin_os"]
